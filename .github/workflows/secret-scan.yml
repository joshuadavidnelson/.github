# Scans the full git history for committed secrets with gitleaks. Personal accounts need no
# license; organizations need a free GITLEAKS_LICENSE secret. Default rules apply; add a
# .gitleaks.toml in the calling repo only for a confirmed false positive.

name: Secret scan

on:
  workflow_call:
    inputs:
      slack-channel:
        description: Project channel for warning and info messages.
        type: string
        default: ''
      alerts-channel:
        description: Channel for critical messages.
        type: string
        default: alerts
    secrets:
      GITLEAKS_LICENSE:
        description: Gitleaks license key, required for organization-owned repositories.
        required: false
      SLACK_BOT_TOKEN:
        description: Slack bot token. Notifications are skipped when unset.
        required: false

permissions: {}

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      # Full history so gitleaks can scan the commit range of the event.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # continue-on-error lets the notify step run; the last step restores the failure.
      # The action reports the gitleaks exit code as an output: 2 means leaks, any
      # other failure (missing license, download error) is a scan error.
      - name: Run gitleaks
        id: gitleaks
        continue-on-error: true
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_ENABLE_COMMENTS: "false"

      # Pull request runs report through the check result only.
      - name: Notify Slack
        if: >-
          steps.gitleaks.outputs.exit-code == '2' && (
          github.event_name == 'schedule' ||
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)))
        uses: joshuadavidnelson/.github/actions/slack-notify@v1
        with:
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          channel: ${{ inputs.slack-channel }}
          alerts-channel: ${{ inputs.alerts-channel }}
          severity: critical
          title: Possible secret committed
          body: Gitleaks found a possible secret in ${{ github.repository }}. Rotate it first, then clean up the history.

      - name: Fail on findings or errors
        if: steps.gitleaks.outcome == 'failure'
        env:
          EXIT_CODE: ${{ steps.gitleaks.outputs.exit-code }}
        run: |
          if [ "$EXIT_CODE" = "2" ]; then
            echo "::error::Gitleaks reported possible secrets; see the Run gitleaks step."
          else
            echo "::error::Gitleaks did not complete a scan (license, download or setup error); the result is unknown. See the Run gitleaks step."
          fi
          exit 1
