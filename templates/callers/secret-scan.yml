# Drop into .github/workflows/ and replace __SHA__ with a full commit SHA of joshuadavidnelson/.github.

name: Secret scan

on:
  pull_request:
  push:
    branches: [main]
  # gitleaks-action scans full history on schedule and manual runs; pull requests and pushes scan only new commits.
  schedule:
    - cron: "41 6 * * 0"
  workflow_dispatch:

permissions: {}

jobs:
  secret-scan:
    permissions:
      contents: read
      pull-requests: read
    uses: joshuadavidnelson/.github/.github/workflows/secret-scan.yml@__SHA__ # main
    with:
      slack-channel: ${{ vars.SLACK_CHANNEL }}
    secrets:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
